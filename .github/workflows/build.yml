name: Build AuthPlugin Dylib

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Compile Dylib using Clang
      run: |
        xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=12.0 -dynamiclib AuthPlugin.m -o AuthPlugin.dylib -framework Foundation -framework UIKit -ldl

    - name: Upload Dylib Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AuthPlugin-Dylib
        path: AuthPlugin.dylib
